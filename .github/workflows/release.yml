name: Build macOS App

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache Swift packages
      uses: actions/cache@v4
      with:
        path: |
          .build
          ~/Library/Caches/org.swift.swiftpm
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Install build dependencies
      run: brew install librsvg

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main

    - name: Cache FFmpeg build
      id: cache-ffmpeg
      uses: actions/cache@v4
      with:
        path: |
          ffmpeg-kit-next-9.0.0/prebuilt
          Packages/FFmpegKit/*.xcframework
        key: ${{ runner.os }}-ffmpeg-${{ hashFiles('build_ffmpeg.sh') }}
        restore-keys: |
          ${{ runner.os }}-ffmpeg-

    - name: Build FFmpegKit
      if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
      run: |
        chmod +x build_ffmpeg.sh

        # Run build with log output on failure
        if ! ./build_ffmpeg.sh; then
          echo ""
          echo "==> FFmpegKit build failed. Showing last 200 lines of build.log:"
          echo "=========================================="
          tail -200 ffmpeg-kit-next-9.0.0/build.log
          echo "=========================================="
          exit 1
        fi

    - name: Generate icon
      run: |
        chmod +x make_icon.sh
        ./make_icon.sh

    - name: Build and package
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Import signing certificate
      run: |
        echo "============================================"
        echo "STEP 1: Decode certificate"
        echo "============================================"
        echo "${{ secrets.SIGNING_CERTIFICATE }}" | base64 --decode > /tmp/cert.p12
        echo "Certificate decoded, size: $(stat -f%z /tmp/cert.p12) bytes"

        echo ""
        echo "============================================"
        echo "STEP 2: Create keychain"
        echo "============================================"
        echo "Creating build.keychain..."
        security create-keychain -p "" build.keychain
        echo "Keychain file location:"
        ls -la ~/Library/Keychains/ | grep build
        echo ""
        echo "Setting default keychain to build.keychain..."
        security default-keychain -s build.keychain
        echo "Default keychain now: $(security default-keychain)"
        echo ""
        echo "Unlocking build.keychain..."
        security unlock-keychain -p "" build.keychain
        echo ""
        echo "Setting keychain search list..."
        security list-keychains -s build.keychain
        echo "Keychain search list now:"
        security list-keychains

        echo ""
        echo "============================================"
        echo "STEP 3: Import certificate into keychain"
        echo "============================================"
        echo "Importing to: $(security default-keychain)"
        security import /tmp/cert.p12 -k build.keychain \
          -P "${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}" \
          -T /usr/bin/codesign
        rm /tmp/cert.p12
        echo ""
        echo "Checking what's in build.keychain after import..."
        echo "All certificates in build.keychain:"
        security find-certificate -a build.keychain 2>&1 | grep -E "labl|snbr|\"keyid\"" | head -20
        echo ""
        echo "All identities (codesigning) in build.keychain:"
        security find-identity -v -p codesigning build.keychain

        echo ""
        echo "============================================"
        echo "STEP 4: Set key partition list"
        echo "============================================"
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "" build.keychain

        echo ""
        echo "============================================"
        echo "STEP 5: Add certificate as trusted root to build.keychain"
        echo "============================================"
        security find-certificate -c "Local Development Signing" -p build.keychain > /tmp/cert.pem
        echo "Adding certificate to build.keychain trust store..."
        sudo security add-trusted-cert -d -r trustRoot -k ~/Library/Keychains/build.keychain-db /tmp/cert.pem
        rm /tmp/cert.pem
        echo ""
        echo "============================================"
        echo "STEP 6: Final verification"
        echo "============================================"
        echo "Keychain search list:"
        security list-keychains
        echo ""
        echo "Searching for 'Local Development Signing' in build.keychain..."
        if security find-certificate -c "Local Development Signing" build.keychain >/dev/null 2>&1; then
          echo "✅ Certificate 'Local Development Signing' found in build.keychain"
          echo ""
          echo "Certificate details:"
          security find-certificate -c "Local Development Signing" build.keychain
        else
          echo "❌ Certificate NOT found"
        fi
        echo ""
        echo "All codesigning identities in build.keychain:"
        security find-identity -v -p codesigning build.keychain

    - name: Unlock keychain before signing
      run: |
        echo "============================================"
        echo "UNLOCK KEYCHAIN - Checking state"
        echo "============================================"
        echo ""
        echo "1. Current keychain list:"
        security list-keychains
        echo ""
        echo "2. Default keychain:"
        security default-keychain
        echo ""
        echo "3. Unlocking build.keychain..."
        security unlock-keychain -p "" build.keychain && echo "✅ Unlocked"
        echo ""
        echo "4. Setting default keychain..."
        security default-keychain -s build.keychain && echo "✅ Default set"
        echo ""
        echo "5. Setting keychain list to ONLY build.keychain..."
        security list-keychains -s "/Users/runner/Library/Keychains/build.keychain-db"
        echo "Keychain list after setting:"
        security list-keychains
        echo ""
        echo "6. Keychain state after unlock:"
        security show-keychain-info build.keychain
        echo ""
        echo "7. Searching for certificate in build.keychain..."
        echo "Looking for 'Local Development Signing'..."
        if security find-certificate -c "Local Development Signing" build.keychain >/dev/null 2>&1; then
          echo "✅ Found in build.keychain"
          security find-identity -v -p codesigning build.keychain
        else
          echo "❌ NOT found in build.keychain"
        fi
        echo ""
        echo "8. Searching in default keychain..."
        if security find-certificate -c "Local Development Signing" >/dev/null 2>&1; then
          echo "✅ Found in default keychain"
          security find-identity -v -p codesigning
        else
          echo "❌ NOT found in default keychain"
        fi
        echo ""
        echo "9. Searching in each keychain in the list..."
        for kc in $(security list-keychains | tr -d '"'); do
          echo ""
          echo "Checking: $kc"
          if security find-certificate -c "Local Development Signing" "$kc" >/dev/null 2>&1; then
            echo "✅ Found in $kc"
          else
            echo "❌ Not in $kc"
          fi
        done

    - name: Sign app
      run: |
        echo "============================================"
        echo "SIGN APP - Pre-signing diagnostics"
        echo "============================================"
        echo ""
        echo "1. Current keychain list:"
        security list-keychains
        echo ""
        echo "2. Default keychain:"
        security default-keychain
        echo ""
        echo "3. Keychain info:"
        security show-keychain-info build.keychain 2>&1 || true
        echo ""
        echo "4. Searching for codesigning identities..."
        echo ""
        echo "   4a. Search WITHOUT specifying keychain (what codesign would see):"
        security find-identity -v -p codesigning
        echo ""
        echo "   4b. Search in build.keychain explicitly:"
        security find-identity -v -p codesigning build.keychain
        echo ""
        echo "   4c. Search in default keychain:"
        DEFAULT_KC=$(security default-keychain | tr -d '"')
        security find-identity -v -p codesigning "$DEFAULT_KC"
        echo ""
        echo "   4d. Search in each keychain in the list:"
        for kc in $(security list-keychains | tr -d '"'); do
          echo ""
          echo "   Checking: $kc"
          RESULT=$(security find-identity -v -p codesigning "$kc" 2>&1)
          if echo "$RESULT" | grep -q "Local Development Signing"; then
            echo "   ✅ Found 'Local Development Signing' in $kc"
            echo "   Full identity line:"
            echo "   $(echo "$RESULT" | grep 'Local Development Signing')"
          else
            echo "   ❌ Not found in $kc"
          fi
          echo "   Valid identities count: $(echo "$RESULT" | grep -c 'valid identities' || echo "0")"
        done

        echo ""
        echo "5. Getting identity details..."
        IDENTITY_HASH=$(security find-identity -v -p codesigning build.keychain | grep "Local Development Signing" | awk '{print $2}')
        echo "Identity hash: $IDENTITY_HASH"
        if [ -z "$IDENTITY_HASH" ]; then
          echo "❌ ERROR: No identity hash found!"
          echo "This means 'Local Development Signing' is not a valid codesigning identity"
          exit 1
        fi
        echo ""
        echo "6. Checking if codesign can access this identity..."
        codesign --display-identity "$IDENTITY_HASH" 2>&1 || echo "(No display-identity support, continuing)"

        echo ""
        echo "============================================"
        echo "SIGNING - Attempting to sign with identity"
        echo "============================================"
        echo ""

        # Try signing with name first
        echo "==> Attempt 1: Signing with name 'Local Development Signing'..."
        echo "    Command: codesign --force --deep --sign 'Local Development Signing' ClipForge.app"
        echo ""

        SIGN_OUTPUT=$(codesign --force --deep --sign "Local Development Signing" ClipForge.app 2>&1)
        SIGN_EXIT=$?

        echo "Exit code: $SIGN_EXIT"
        echo "Output:"
        echo "$SIGN_OUTPUT"

        if [ $SIGN_EXIT -ne 0 ]; then
          echo "❌ Failed with name (exit code: $SIGN_EXIT)"
          echo ""
          echo "==> Attempt 2: Signing with hash '$IDENTITY_HASH'..."
          echo "    Command: codesign --force --deep --sign '$IDENTITY_HASH' ClipForge.app"
          echo ""

          SIGN_OUTPUT=$(codesign --force --deep --sign "$IDENTITY_HASH" ClipForge.app 2>&1)
          SIGN_EXIT=$?

          echo "Exit code: $SIGN_EXIT"
          echo "Output:"
          echo "$SIGN_OUTPUT"

          if [ $SIGN_EXIT -ne 0 ]; then
            echo "❌ ERROR: Signing failed with both name and hash"
            exit 1
          fi
        fi

        echo ""
        echo "============================================"
        echo "POST-SIGNING - Verifying what was actually used"
        echo "============================================"
        echo ""
        echo "Checking what identity was used for signing..."
        echo ""

        # Get detailed signature info
        SIGNATURE_INFO=$(codesign -dvvv ClipForge.app 2>&1)
        echo "$SIGNATURE_INFO" | head -40

        echo ""
        echo "Extracting key info:"
        echo ""

        # Check for adhoc signature
        if echo "$SIGNATURE_INFO" | grep -q "Signature=adhoc"; then
          echo "❌ CRITICAL ERROR: Signature is ADHOC!"
          echo ""
          echo "This means codesign fell back to adhoc signing instead of using the certificate."
          echo "This should NOT happen - the command should have failed instead."
          echo ""
          echo "Full signature details:"
          echo "$SIGNATURE_INFO"
          exit 1
        fi

        # Check for the expected identity
        if echo "$SIGNATURE_INFO" | grep -q "Authority=Local Development Signing"; then
          echo "✅ Signed with 'Local Development Signing'"
        elif echo "$SIGNATURE_INFO" | grep -q "Local Development Signing"; then
          echo "✅ Identity contains 'Local Development Signing'"
        else
          echo "⚠️ WARNING: Signature does not appear to be from 'Local Development Signing'"
          echo ""
          echo "Authority info:"
          echo "$SIGNATURE_INFO" | grep "Authority="
        fi

        # Show the final signature status
        echo ""
        echo "Final signature status:"
        codesign --verify --verbose ClipForge.app 2>&1 || echo "Verification returned non-zero"

    - name: Create ZIP for Sparkle
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        ditto -c -k --keepParent ClipForge.app "ClipForge-${VERSION}.zip"

    - name: Sign update
      if: startsWith(github.ref, 'refs/tags/')
      id: sign
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        ZIP="ClipForge-${VERSION}.zip"

        echo "${{ secrets.SPARKLE_PRIVATE_KEY }}" > /tmp/sparkle_key.txt
        RAW=$(./.build/artifacts/sparkle/Sparkle/bin/sign_update "$ZIP" --ed-key-file /tmp/sparkle_key.txt)
        rm /tmp/sparkle_key.txt

        # Extract just the base64 signature from: sparkle:edSignature="..." length="..."
        SIGNATURE=$(echo "$RAW" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')

        LENGTH=$(stat -f%z "$ZIP")
        BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" ClipForge.app/Contents/Info.plist)

        echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"
        echo "length=$LENGTH" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

    - name: Upload app bundle
      uses: actions/upload-artifact@v4
      with:
        name: ClipForge-app
        path: ClipForge.app

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ClipForge-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update appcast
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION="${{ steps.sign.outputs.version }}"
        SIGNATURE="${{ steps.sign.outputs.signature }}"
        LENGTH="${{ steps.sign.outputs.length }}"
        BUILD="${{ steps.sign.outputs.build }}"
        DATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")

        # Build the new item block
        NEW_ITEM=$(cat <<EOF
        <item>
            <title>Version ${VERSION}</title>
            <pubDate>${DATE}</pubDate>
            <sparkle:version>${BUILD}</sparkle:version>
            <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
            <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
            <enclosure
                url="https://github.com/J-Liu/ClipForge/releases/download/v${VERSION}/ClipForge-${VERSION}.zip"
                sparkle:edSignature="${SIGNATURE}"
                length="${LENGTH}"
                type="application/octet-stream"/>
        </item>
        EOF
        )

        # Insert the new item right after <language>en</language>
        python3 - <<PYEOF
        import re
        path = "docs/appcast.xml"
        with open(path) as f:
            content = f.read()

        new_item = """${NEW_ITEM}"""

        content = re.sub(
            r'(<language>en</language>)',
            r'\1\n    ' + new_item,
            content,
            count=1
        )

        with open(path, "w") as f:
            f.write(content)
        PYEOF

        # Commit and push
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/appcast.xml
        git commit -m "Update appcast for v${VERSION}"
        git push origin HEAD:main
