name: Build macOS App

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache Swift packages
      uses: actions/cache@v4
      with:
        path: |
          .build
          ~/Library/Caches/org.swift.swiftpm
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Import signing certificate
      run: |
        # Decode .p12 from secret
        echo "${{ secrets.SIGNING_CERTIFICATE }}" | base64 --decode > /tmp/cert.p12

        # Create and unlock a temporary keychain
        security create-keychain -p "" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "" build.keychain

        # Import the .p12
        security import /tmp/cert.p12 -k build.keychain \
          -P "${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}" \
          -T /usr/bin/codesign

        # Allow codesign to access the key without prompting
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "" build.keychain

        # Export the certificate part as PEM and add it as trusted
        security find-certificate -c "Local Development Signing" -p build.keychain > /tmp/cert.pem
        sudo security add-trusted-cert -d -r trustRoot \
          -k /Library/Keychains/System.keychain /tmp/cert.pem

        rm /tmp/cert.p12 /tmp/cert.pem

    - name: Install build dependencies
      run: brew install librsvg gnu-sed

    - name: Cache FFmpeg build
      id: cache-ffmpeg
      uses: actions/cache@v4
      with:
        path: |
          ffmpeg-kit-next-9.0.0/prebuilt
          Packages/FFmpegKit/*.xcframework
        key: ${{ runner.os }}-ffmpeg-${{ hashFiles('build_ffmpeg.sh') }}
        restore-keys: |
          ${{ runner.os }}-ffmpeg-

    - name: Build FFmpegKit
      if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
      run: |
        # Download and extract ffmpeg-kit-next
        curl -L -o /tmp/ffmpeg-kit.tar.gz https://github.com/arthenica/ffmpeg-kit-next/archive/refs/tags/v9.0.0.tar.gz
        tar -xzf /tmp/ffmpeg-kit.tar.gz

        cd ffmpeg-kit-next-9.0.0

        # Use GNU sed
        export SED="gsed"

        # Build macOS xcframework
        ./macos.sh \
          -x \
          --enable-lib-macos-videotoolbox \
          --enable-lib-macos-audiotoolbox \
          --enable-lib-macos-avfoundation

        # Copy xcframeworks to Packages/FFmpegKit
        cp -r prebuilt/bundle-apple-xcframework-macos-10.15/*.xcframework ../Packages/FFmpegKit/

    - name: Generate icon
      run: |
        chmod +x make_icon.sh
        ./make_icon.sh

    - name: Build and package
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Unlock keychain before signing
      run: |
        echo "==> Ensuring keychain is unlocked..."
        security unlock-keychain -p "" build.keychain && echo "✅ Keychain unlocked"
        security default-keychain -s build.keychain && echo "✅ Default keychain set"
        security list-keychains -s build.keychain && echo "✅ Keychain list updated"
        echo ""
        echo "==> Verifying keychain state:"
        security show-keychain-info build.keychain

    - name: Sign app
      run: |
        echo "==> Starting signing process..."
        for i in 1 2 3 4; do
          echo ""
          echo "==> Attempt $i of 4"
          echo "==> Running codesign with 60 second timeout..."
          if perl -e '$SIG{ALRM} = sub { exit 14 }; alarm 60; exec @ARGV or exit 1' -- codesign --force --deep --sign "Local Development Signing" ClipForge.app 2>&1 | tee /tmp/sign.log; then
            echo "✅ Signed successfully on attempt $i"
            echo ""
            echo "==> Verifying signature..."
            codesign -dvvv ClipForge.app 2>&1 | head -20
            exit 0
          fi

          EXIT_CODE=$?
          echo "❌ Attempt $i failed with exit code $EXIT_CODE"
          echo ""
          echo "==> Sign log output:"
          cat /tmp/sign.log
          echo ""

          if grep -q "timestamp service is not available\|A timestamp was expected but was not found" /tmp/sign.log 2>/dev/null; then
            echo "==> Diagnosis: Timestamp service unavailable"
          elif grep -q "no identity found\|could not find" /tmp/sign.log 2>/dev/null; then
            echo "==> Diagnosis: Certificate not found by codesign"
          elif [ $EXIT_CODE -eq 14 ]; then
            echo "==> Diagnosis: Timeout after 60 seconds (no response)"
          else
            echo "==> Diagnosis: Other error (see log above)"
          fi

          if [ $i -lt 4 ]; then
            echo "==> Waiting 15 seconds before retry..."
            sleep 15
          fi
        done

        echo ""
        echo "❌ All 4 attempts failed"
        exit 1

    - name: Create ZIP for Sparkle
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        ditto -c -k --keepParent ClipForge.app "ClipForge-${VERSION}.zip"

    - name: Sign update
      if: startsWith(github.ref, 'refs/tags/')
      id: sign
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        ZIP="ClipForge-${VERSION}.zip"

        echo "${{ secrets.SPARKLE_PRIVATE_KEY }}" > /tmp/sparkle_key.txt
        RAW=$(./.build/artifacts/sparkle/Sparkle/bin/sign_update "$ZIP" --ed-key-file /tmp/sparkle_key.txt)
        rm /tmp/sparkle_key.txt

        # Extract just the base64 signature from: sparkle:edSignature="..." length="..."
        SIGNATURE=$(echo "$RAW" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')

        LENGTH=$(stat -f%z "$ZIP")
        BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" ClipForge.app/Contents/Info.plist)

        echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"
        echo "length=$LENGTH" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

    - name: Upload app bundle
      uses: actions/upload-artifact@v4
      with:
        name: ClipForge-app
        path: ClipForge.app

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ClipForge-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update appcast
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION="${{ steps.sign.outputs.version }}"
        SIGNATURE="${{ steps.sign.outputs.signature }}"
        LENGTH="${{ steps.sign.outputs.length }}"
        BUILD="${{ steps.sign.outputs.build }}"
        DATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")

        # Build the new item block
        NEW_ITEM=$(cat <<EOF
        <item>
            <title>Version ${VERSION}</title>
            <pubDate>${DATE}</pubDate>
            <sparkle:version>${BUILD}</sparkle:version>
            <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
            <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
            <enclosure
                url="https://github.com/J-Liu/ClipForge/releases/download/v${VERSION}/ClipForge-${VERSION}.zip"
                sparkle:edSignature="${SIGNATURE}"
                length="${LENGTH}"
                type="application/octet-stream"/>
        </item>
        EOF
        )

        # Insert the new item right after <language>en</language>
        python3 - <<PYEOF
        import re
        path = "docs/appcast.xml"
        with open(path) as f:
            content = f.read()

        new_item = """${NEW_ITEM}"""

        content = re.sub(
            r'(<language>en</language>)',
            r'\1\n    ' + new_item,
            content,
            count=1
        )

        with open(path, "w") as f:
            f.write(content)
        PYEOF

        # Commit and push
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/appcast.xml
        git commit -m "Update appcast for v${VERSION}"
        git push origin HEAD:main
