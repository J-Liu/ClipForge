name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Install librsvg
        run: brew install librsvg

      - name: Generate icon
        run: |
          chmod +x make_icon.sh
          ./make_icon.sh

      - name: Build app bundle
        run: |
          chmod +x build_app.sh
          ./build_app.sh

      - name: Sign app bundle
        run: |
          codesign --force --deep --sign - --identifier com.jialiu.clipforge ClipForge.app

      - name: Verify app bundle
        run: |
          ls -la ClipForge.app
          test -d ClipForge.app
          codesign --verify --verbose ClipForge.app

      - name: Create ZIP for Sparkle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          zip -r "ClipForge-${VERSION}.zip" ClipForge.app

      - name: Sign update
        id: sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="ClipForge-${VERSION}.zip"

          echo "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_key.txt
          RAW=$(./.build/artifacts/sparkle/Sparkle/bin/sign_update "$ZIP" --ed-key-file /tmp/sparkle_key.txt)
          rm /tmp/sparkle_key.txt

          # Extract just the base64 signature
          SIGNATURE=$(echo "$RAW" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')

          LENGTH=$(stat -f%z "$ZIP")
          BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" ClipForge.app/Contents/Info.plist)

          echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"
          echo "length=$LENGTH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ClipForge-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update appcast
        run: |
          VERSION="${{ steps.sign.outputs.version }}"
          SIGNATURE="${{ steps.sign.outputs.signature }}"
          LENGTH="${{ steps.sign.outputs.length }}"
          BUILD="${{ steps.sign.outputs.build }}"
          DATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")

          # Download existing appcast if available
          curl -sL https://J-Liu.github.io/ClipForge/appcast.xml -o appcast.xml || true

          # Build the new item block
          NEW_ITEM=$(cat <<EOF
          <item>
              <title>Version ${VERSION}</title>
              <pubDate>${DATE}</pubDate>
              <sparkle:version>${BUILD}</sparkle:version>
              <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
              <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
              <enclosure
                  url="https://github.com/J-Liu/ClipForge/releases/download/v${VERSION}/ClipForge-${VERSION}.zip"
                  sparkle:edSignature="${SIGNATURE}"
                  length="${LENGTH}"
                  type="application/octet-stream"/>
          </item>
          EOF
          )

          # Create or update appcast.xml
          if [ -f appcast.xml ] && grep -q "</channel>" appcast.xml; then
            # Insert the new item right after <language>en</language>
            python3 - <<PYEOF
          import re
          path = "appcast.xml"
          with open(path) as f:
              content = f.read()

          new_item = """${NEW_ITEM}"""

          content = re.sub(
              r'(<language>en</language>)',
              r'\1\n    ' + new_item,
              content,
              count=1
          )

          with open(path, "w") as f:
              f.write(content)
          PYEOF
          else
            cat > appcast.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
              <channel>
                  <title>ClipForge Changelog</title>
                  <link>https://J-Liu.github.io/ClipForge/appcast.xml</link>
                  <description>ClipForge release updates</description>
                  <language>en</language>
          XMLEOF
            cat >> appcast.xml << EOF
              ${NEW_ITEM}
          EOF
            echo "              </channel>" >> appcast.xml
            echo "          </rss>" >> appcast.xml
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
          keep_files: true
